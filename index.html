<!DOCTYPE html>
<html lang="en">

<head>
    <title>StudyBuddy Tutors</title>
</head>

<body>

    <header>
        <h1>StudyBuddy Tutors</h1>
        <p>Learn with the best tutors.</p>

        <nav>
            <a href="#tutors">Tutors</a>
            <a href="#booking">Book</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <section id="tutors">
            <h2>Our Tutors</h2>

            <article>
                <h3>Rahul</h3>
                <p>Maths tutor - ₹500 per session.</p>
            </article>

            <article>
                <h3>Priya</h3>
                <p>English tutor - ₹400 per session.</p>
            </article>

            <article>
                <h3>Arjun</h3>
                <p>Computer Science tutor - ₹600 per session.</p>
            </article>
        </section>

        <section id="booking">
            <h2>Book a Session</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name">

                <label for="email">Email:</label>
                <input type="email" id="email">

                <label for="subject">Subject:</label>
                <select id="subject">
                    <option>Maths</option>
                    <option>English</option>
                    <option>Computer Science</option>
                </select>

                <label for="date">Dayit branch:</label>
                <input type="date" id="date">

                <label for="message">Message:</label>
                <textarea id="message"></textarea>

                <button type="submit">Book</button>
            </form>
        </section>

    </main>

    <footer id="contact">
        <p> 2026 StudyBuddy Tutors</p>
        <p>Contact: studybuddy@example.com </p>
    </footer>

</body>
</html>
